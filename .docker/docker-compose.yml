services:
  automate_database:
    image: postgres:latest
    container_name: automate-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER={DB_USER}
      - POSTGRES_PASSWORD={DB_PASSWORD}
      - POSTGRES_DB=automate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: automate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning


volumes:
  pgdata:
    name: automate_pgdata
  redis_data:
    name: automate_redis_data