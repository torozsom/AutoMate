name: Security - Dependency review

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: 'Dependencies: Vulnerability review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject newly introduced high or critical vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # No arbitrary license policy or write-token requirement for fork and bot PRs.
          license-check: false
          comment-summary-in-pr: never
