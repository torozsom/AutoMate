name: automate-telemetry
services:
  permissions:
    image: busybox:1.37
    profiles: [ telemetry ]
    user: root
    command: [ "sh", "-ec", "chown -R 10001:10001 /loki; chown -R 10001:10001 /mimir" ]
    volumes: [ loki:/loki, mimir:/mimir ]
    network_mode: none
  objects:
    image: chrislusf/seaweedfs:4.48
    profiles: [ telemetry ]
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?Set a dedicated object-store user}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set a generated object-store password}
      S3_BUCKET: automate-logs,automate-metrics,automate-rules,automate-alerts
    volumes: [ objects:/data ]
    networks: [ storage ]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.7.5
    profiles: [ telemetry ]
    command: -config.file=/etc/loki/config.yaml -config.expand-env=true
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?}
    depends_on:
      objects: { condition: service_started }
      permissions: { condition: service_completed_successfully }
    volumes: [ "./loki.yaml:/etc/loki/config.yaml:ro", "loki:/var/loki" ]
    networks: [ storage, gateway ]
    restart: unless-stopped
  mimir:
    image: grafana/mimir:2.17.2
    user: "10001:10001"
    working_dir: /var/mimir
    profiles: [ telemetry ]
    command: -target=all -config.file=/etc/mimir/config.yaml -config.expand-env=true
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?}
    depends_on:
      objects: { condition: service_started }
      permissions: { condition: service_completed_successfully }
    volumes: [ "./mimir.yaml:/etc/mimir/config.yaml:ro", "mimir:/var/mimir" ]
    networks: [ storage, gateway ]
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    profiles: [ telemetry ]
    depends_on: [ loki, mimir ]
    ports: [ "127.0.0.1:${TELEMETRY_PORT:-9443}:443" ]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TELEMETRY_SECRETS_DIR:?Set an absolute secrets directory}:/run/telemetry:ro
    networks: [ gateway ]
    restart: unless-stopped
volumes:
  objects:
  loki:
  mimir:
networks:
  storage: { internal: true }
  gateway:
