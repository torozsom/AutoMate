# The gateway is the sole published interface; raw tenant stores stay private.
server {
    listen 443 ssl;
    ssl_certificate /run/telemetry/tls.crt;
    ssl_certificate_key /run/telemetry/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "AutoMate telemetry services";
    auth_basic_user_file /run/telemetry/htpasswd;
    client_max_body_size 8m;
    proxy_read_timeout 15s;
    proxy_set_header X-Scope-OrgID $http_x_scope_orgid;
    location = /loki/loki/api/v1/push {
        limit_except POST { deny all; }
        proxy_pass http://loki:3100/loki/api/v1/push;
    }
    location = /loki/loki/api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass http://loki:3100/loki/api/v1/query_range;
    }
    location = /loki/ready { proxy_pass http://loki:3100/ready; }
    # Grafana connection checks, autocomplete and Explore read-only discovery.
    location ~ ^/loki/loki/api/v1/(query|labels|label/[^/]+/values|series|index/stats|index/volume|index/volume_range|detected_fields|detected_labels|patterns|status/buildinfo)$ {
        limit_except GET { deny all; }
        rewrite ^/loki/(.*)$ /$1 break;
        proxy_pass http://loki:3100;
    }
    location = /mimir/otlp/v1/metrics {
        limit_except POST { deny all; }
        proxy_pass http://mimir:9009/otlp/v1/metrics;
    }
    location = /mimir/prometheus/api/v1/query {
        limit_except GET { deny all; }
        proxy_pass http://mimir:9009/prometheus/api/v1/query;
    }
    location = /mimir/prometheus/api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass http://mimir:9009/prometheus/api/v1/query_range;
    }
    location = /mimir/ready { proxy_pass http://mimir:9009/ready; }
    location ~ ^/mimir/prometheus/api/v1/(labels|label/[^/]+/values|series|metadata|status/buildinfo)$ {
        limit_except GET { deny all; }
        rewrite ^/mimir/(.*)$ /$1 break;
        proxy_pass http://mimir:9009;
    }
    location / { return 404; }
}
