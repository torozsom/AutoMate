name: automate-infrastructure

services:
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: automate
      POSTGRES_USER: automate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U automate -d automate" ]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    container_name: redis
    image: redis:alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Expand the password inside the container rather than through a shell on the host.
    command: [ "sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping" ]
      interval: 3s
      timeout: 5s
      retries: 30

# Keep the existing data volumes while giving Docker Desktop a simple project name.
volumes:
  postgres-data:
    name: automate-infrastructure_postgres-data
  redis-data:
    name: automate-infrastructure_redis-data

networks:
  default:
    name: automate-infrastructure_default
