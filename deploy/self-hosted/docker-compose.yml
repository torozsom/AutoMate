services:
  automate:
    image: ${AUTOMATE_IMAGE}
    restart: unless-stopped
    ports:
      - "${AUTOMATE_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HostingProfile__Mode: SelfHosted
      TelemetryStorage__Backend: LokiMimir
      TelemetryStorage__DeliveryMode: DiskGateway
      TelemetryStorage__GatewayUrl: ${TELEMETRY_GATEWAY_URL:?Configure the private telemetry gateway}
      TelemetryStorage__GatewayToken: ${TELEMETRY_INGEST_TOKEN:?Configure a private random gateway credential}
      TelemetryStorage__LokiUrl: ${TELEMETRY_LOKI_URL:?Configure the private Loki endpoint}
      TelemetryStorage__MetricsWriteUrl: ${TELEMETRY_METRICS_WRITE_URL:?Configure the private Mimir write endpoint}
      TelemetryStorage__MetricsQueryUrl: ${TELEMETRY_METRICS_QUERY_URL:?Configure the private Mimir query endpoint}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=automate;Username=automate;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Authentication__GitHub__ClientId: ${AUTH_GITHUB_CLIENT_ID}
      Authentication__GitHub__ClientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
      Authentication__Microsoft__ClientId: ${AUTH_MICROSOFT_CLIENT_ID}
      Authentication__Microsoft__ClientSecret: ${AUTH_MICROSOFT_CLIENT_SECRET}
      Authentication__Microsoft__TenantId: ${AUTH_MICROSOFT_TENANT_ID:-organizations}
    volumes:
      # Mount only the directory selected by the installer, never the entire host filesystem.
      - ${PROJECTS_ROOT}:/workspace
      # Docker Desktop/Linux engine socket. On Windows, use Docker Desktop's Linux containers backend.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automate
      POSTGRES_USER: automate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U automate -d automate" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
